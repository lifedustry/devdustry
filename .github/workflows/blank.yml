name: Auto Release Latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download setup script
        run: |
          curl -L -o lifedustry_automatic_setup.bat https://raw.githubusercontent.com/lifedustry/devdustry/main/main.bat

      - name: Delete old release/tag if exists
        uses: dev-drprasad/delete-tag-and-release@v1
        with:
          tag_name: latest
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: lifedustry_automatic_setup.bat
          tag_name: latest
          name: "Lifedustry Setup (Dernière version)"
          body: "Mise à jour automatique du script d'installation à chaque commit sur main."
