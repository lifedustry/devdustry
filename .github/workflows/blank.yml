name: Build and Release

on:
  push:
    branches:
      - main # Modifie si ta branche principale s'appelle autrement

permissions:
  contents: write # Indispensable pour créer une release et uploader des fichiers

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: main-windows.exe
          - os: ubuntu-latest
            asset_name: main-linux.bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # pip install -r requirements.txt (si besoin)

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --noconsole main.py

      - name: Prepare binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv dist/main.exe dist/${{ matrix.asset_name }}
          else
            mv dist/main dist/${{ matrix.asset_name }}
          fi

      - name: Upload binary to workspace
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 1 # Stockage éphémère juste pour le transfert entre jobs

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: all-binaries

      - name: Generate version tag (Timestamp)
        id: meta
        run: |
          TAG="v$(date +'%Y.%m.%d-%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Release ${{ steps.meta.outputs.tag }}"
          body: "Mise à jour automatique des binaires depuis la branche main."
          files: |
            all-binaries/binary-windows-latest/main-windows.exe
            all-binaries/binary-ubuntu-latest/main-linux.bin
