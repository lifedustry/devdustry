name: Build Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            output_name: install.exe
          - os: ubuntu-latest
            output_name: install-linux

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installation de PyInstaller
      run: pip install pyinstaller

    - name: Compilation du script en exécutable
      run: pyinstaller --onefile --noconsole install.py

    - name: Renommer l'exécutable
      shell: bash
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          mv dist/install.exe dist/${{ matrix.output_name }}
        else
          mv dist/install dist/${{ matrix.output_name }}
        fi

    - name: Sauvegarder l'exécutable comme artefact
      uses: actions/upload-artifact@v4
      with:
        name: installer-${{ matrix.os }}
        path: dist/${{ matrix.output_name }}