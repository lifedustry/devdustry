name: Build Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            output_name: install.exe
            pyinstaller_args: "--onefile"
          - os: ubuntu-latest
            output_name: install-linux
            pyinstaller_args: "--onefile"

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installation de PyInstaller
      run: pip install pyinstaller

    - name: Compilation du script
      run: pyinstaller ${{ matrix.pyinstaller_args }} main.py

    - name: Renommer l'exécutable
      shell: bash
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          mv dist/main.exe dist/${{ matrix.output_name }}
        else
          mv dist/main dist/${{ matrix.output_name }}
        fi

    - name: Sauvegarder l'artefact
      uses: actions/upload-artifact@v4
      with:
        name: installer-${{ matrix.os }}
        path: dist/${{ matrix.output_name }}

  release:
    name: Create Nightly/Latest Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger les artefacts
        uses: actions/download-artifact@v4
        with:
          path: bin/

      - name: Publier/Mettre à jour la Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Auto-Build"
          prerelease: true
          files: |
            bin/installer-windows-latest/install.exe
            bin/installer-ubuntu-latest/install-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}